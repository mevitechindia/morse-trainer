name: Deploy Web to Cloudflare Pages

# Deploys the web app (src/) to the morse-trainer Cloudflare Pages project.
#
# The Build and Release workflow publishes GitHub releases using the job's
# GITHUB_TOKEN, and events caused by GITHUB_TOKEN do not trigger other
# workflows — so `on: release: published` would never fire here. Instead this
# runs when the Build and Release workflow completes successfully on a
# release tag (that workflow only triggers on v* tags). Pre-release tags
# (v2.0.0-rc1 — anything with a hyphen) do not update the production site.
#
# Can also be run manually: gh workflow run "Deploy Web to Cloudflare Pages" --ref <tag>

on:
  workflow_run:
    workflows: ["Build and Release"]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' &&
         !contains(github.event.workflow_run.head_branch, '-'))
      }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The exact commit the release was built from (or the manual ref).
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Sanity check the web app
        run: |
          test -f src/index.html
          test -f src/manifest.webmanifest

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '3'
          command: pages deploy src --project-name=morse-trainer --branch=main
