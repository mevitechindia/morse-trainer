name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --publish never

      - if: matrix.os == 'ubuntu-latest'
        uses: docker/setup-buildx-action@v3
        with:
          version: latest
      - if: matrix.os == 'ubuntu-latest'
        run: |
          docker run --rm \
            -v "$(pwd)":/project \
            -v morse-trainer-node-modules:/project/node_modules \
            -v morse-trainer-electron-cache:/root/.cache/electron \
            -v morse-trainer-builder-cache:/root/.cache/electron-builder \
            -w /project \
            electronuserland/builder:20 \
            /bin/bash -c "npm ci && npx electron-builder --linux rpm --x64 --publish never"

      - uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*.exe
            dist/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
